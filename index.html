<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC Airflow Simulator</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewport">
        <div id="hud">
          <div class="hud-card" id="hud-temps"></div>
          <div class="hud-card" id="hud-flow"></div>
        </div>
        <div id="legend"></div>
        <div id="tooltip" hidden></div>
        <div id="help">Drag to orbit · scroll to zoom · right-drag to pan · <b>click a fan slot</b> to cycle intake / exhaust / open / blocked · <b>space</b> pauses</div>
      </div>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
